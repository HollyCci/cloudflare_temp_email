name: End-to-End Tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Run E2E tests
        env:
          HEROUI_SETUP_KEY: ${{ secrets.HEROUI_SETUP_KEY }}
          COMPOSE_PROFILES: ${{ secrets.HEROUI_SETUP_KEY && 'browser' || '' }}
          E2E_PROJECTS: ${{ secrets.HEROUI_SETUP_KEY && '--project=api --project=browser' || '--project=api' }}
          E2E_FRONTEND_URL: ${{ secrets.HEROUI_SETUP_KEY && 'https://frontend:5173' || '' }}
          E2E_FRONTEND_URL_ENV_OFF: ${{ secrets.HEROUI_SETUP_KEY && 'https://frontend-env-off:5174' || '' }}
        run: |
          cd e2e
          docker compose up --build --abort-on-container-exit --exit-code-from e2e-runner

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: |
            e2e/test-results/
            e2e/playwright-report/
          retention-days: 30

      - name: Cleanup
        if: always()
        run: |
          cd e2e
          docker compose down -v
